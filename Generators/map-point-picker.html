<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Point Picker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef4fb;
      color: #0f172a;
      overflow: hidden;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 360px 1fr;
    }

    .panel {
      padding: 22px;
      background: white;
      border-right: 1px solid #dbe3ef;
      overflow: auto;
      box-shadow: 12px 0 30px rgba(15, 23, 42, 0.08);
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 900;
    }

    .panel p {
      margin: 0 0 20px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 700;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #334155;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      padding: 0 12px;
      outline: none;
      font-size: 13px;
      font-weight: 700;
      background: #f8fafc;
    }

    input:focus {
      border-color: #0f8cff;
      background: white;
      box-shadow: 0 0 0 4px rgba(15, 140, 255, 0.14);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0 18px;
    }

    button {
      height: 38px;
      border: none;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #062b63, #0f8cff);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button.clear {
      background: linear-gradient(135deg, #7f1d1d, #ef4444);
    }

    .latest-box {
      padding: 14px;
      border-radius: 16px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }

    .latest-box h2 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 900;
    }

    .latest-box code {
      color: #0b4ea2;
      font-size: 14px;
      font-weight: 900;
    }

    .points {
      display: grid;
      gap: 10px;
    }

    .point-card {
      padding: 12px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .point-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 900;
    }

    .point-card pre {
      margin: 0;
      padding: 10px;
      border-radius: 12px;
      overflow: auto;
      color: #e2e8f0;
      background: #020617;
      font-size: 12px;
      line-height: 1.45;
    }

    .map-area {
      padding: 24px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .map-box {
      position: relative;
      width: min(1180px, 100%);
      height: min(780px, 100%);
      border-radius: 26px;
      overflow: hidden;
      background: #dbeafe;
      cursor: crosshair;
      box-shadow:
        0 30px 90px rgba(15, 23, 42, 0.22),
        0 0 0 1px rgba(255, 255, 255, 0.72);
    }

    .map-box img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
    }

    .point-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .point {
  position: absolute;
  width: 12px;
  height: 12px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: #22c55e;
  border: 2px solid white;
  box-shadow:
    0 0 0 5px rgba(34, 197, 94, 0.18),
    0 0 12px rgba(34, 197, 94, 0.9);
  display: grid;
  place-items: center;
  color: white;
  font-size: 7px;
  font-weight: 900;
}

    .crosshair {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
    }

    .map-box:hover .crosshair {
      opacity: 1;
    }

    .crosshair-x,
    .crosshair-y {
      position: absolute;
      background: rgba(15, 140, 255, 0.65);
    }

    .crosshair-x {
      width: 100%;
      height: 1px;
      top: var(--mouse-y, 50%);
      left: 0;
    }

    .crosshair-y {
      width: 1px;
      height: 100%;
      left: var(--mouse-x, 50%);
      top: 0;
    }

    .copy-note {
      margin-top: 10px;
      color: #059669;
      font-size: 12px;
      font-weight: 800;
      display: none;
    }

    .copy-note.show {
      display: block;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
      }

      .panel {
        border-right: none;
        border-bottom: 1px solid #dbe3ef;
      }

      .map-area {
        height: 70vh;
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="panel">
      <h1>Map Point Picker</h1>
      <p>
        Click anywhere on the map. It will generate the exact
        <strong>x/y percentage</strong> for your scene's <code>mapPoint</code>.
      </p>

      <label for="imagePath">Map image path</label>
      <input
        id="imagePath"
        value="/maps/savoury-placeholder.jpg"
        placeholder="/maps/savoury-placeholder.jpg"
      />

      <div class="actions">
        <button onclick="loadImage()">Load Image</button>
        <button onclick="copyLatest()">Copy Latest</button>
        <button onclick="copyAll()">Copy All</button>
        <button class="clear" onclick="clearPoints()">Clear</button>
      </div>

      <div class="latest-box">
        <h2>Latest Point</h2>
        <code id="latestText">No point selected</code>
        <div id="copyNote" class="copy-note">Copied.</div>
      </div>

      <div id="points" class="points"></div>
    </aside>

    <main class="map-area">
      <div id="mapBox" class="map-box">
        <img id="mapImage" src="/maps/savoury-placeholder.jpg" alt="Map" />

        <div class="crosshair">
          <div class="crosshair-x"></div>
          <div class="crosshair-y"></div>
        </div>

        <div id="pointLayer" class="point-layer"></div>
      </div>
    </main>
  </div>

  <script>
    const mapBox = document.getElementById("mapBox");
    const mapImage = document.getElementById("mapImage");
    const imagePath = document.getElementById("imagePath");
    const pointLayer = document.getElementById("pointLayer");
    const pointsContainer = document.getElementById("points");
    const latestText = document.getElementById("latestText");
    const copyNote = document.getElementById("copyNote");
    
    let points = [];

    function loadImage() {
      mapImage.src = imagePath.value.trim();
    }

function handleMapMove(event) {
  const rect = mapBox.getBoundingClientRect();

  const mouseX = event.clientX - rect.left;
  const mouseY = event.clientY - rect.top;

  const xPercent = (mouseX / rect.width) * 100;
  const yPercent = (mouseY / rect.height) * 100;

  // Crosshair stays raw so it follows your mouse exactly.
  mapBox.style.setProperty("--mouse-x", `${xPercent}%`);
  mapBox.style.setProperty("--mouse-y", `${yPercent}%`);
}

const X_OFFSET = 1.33;
const Y_OFFSET = 2.8;

function handleMapClick(event) {
  const rect = mapBox.getBoundingClientRect();

  const clickX = event.clientX - rect.left;
  const clickY = event.clientY - rect.top;

  const rawX = Number(((clickX / rect.width) * 100).toFixed(2));
  const rawY = Number(((clickY / rect.height) * 100).toFixed(2));

  const outputX = Number((rawX + X_OFFSET).toFixed(2));
  const outputY = Number((rawY + Y_OFFSET).toFixed(2));

  const point = {
    name: `Point${points.length + 1}`,

    // exact visual click position in pixels
    pixelX: clickX,
    pixelY: clickY,

    // corrected output for mapData.js
    x: outputX,
    y: outputY,
  };

  points.push(point);
  renderPoints();
}

function renderPoints() {
  pointLayer.innerHTML = "";
  pointsContainer.innerHTML = "";

  points.forEach((point, index) => {
    const dot = document.createElement("div");
    dot.className = "point";

    // Render dot exactly where you clicked
    dot.style.left = `${point.pixelX}px`;
    dot.style.top = `${point.pixelY}px`;

    dot.textContent = index + 1;
    pointLayer.appendChild(dot);

    const card = document.createElement("div");
    card.className = "point-card";

    card.innerHTML = `
      <strong>${point.name}</strong>
      <pre>mapPoint: {
  x: ${point.x},
  y: ${point.y},
},</pre>
    `;

    pointsContainer.prepend(card);
  });

  const latest = points[points.length - 1];

  if (latest) {
    latestText.textContent = `x: ${latest.x}, y: ${latest.y}`;
  } else {
    latestText.textContent = "No point selected";
  }
}
    function renderPoints() {
  pointLayer.innerHTML = "";
  pointsContainer.innerHTML = "";

  points.forEach((point, index) => {
    const dot = document.createElement("div");
    dot.className = "point";

    // dot appears exactly where your mouse clicked
    dot.style.left = `${point.pixelX}px`;
    dot.style.top = `${point.pixelY}px`;

    dot.textContent = index + 1;
    pointLayer.appendChild(dot);

    const card = document.createElement("div");
    card.className = "point-card";

    card.innerHTML = `
      <strong>${point.name}</strong>
      <pre>mapPoint: {
  x: ${point.x},
  y: ${point.y},
},</pre>
    `;

    pointsContainer.prepend(card);
  });

  const latest = points[points.length - 1];

  if (latest) {
    latestText.textContent = `x: ${latest.x}, y: ${latest.y}`;
  } else {
    latestText.textContent = "No point selected";
  }
}

    function getLatestText() {
      const latest = points[points.length - 1];

      if (!latest) return "";

      return `mapPoint: {
  x: ${latest.x},
  y: ${latest.y},
},`;
    }

    function getAllText() {
      return points
        .map((point) => {
          return `${point.name}: {
  mapPoint: {
    x: ${point.x},
    y: ${point.y},
  },
},`;
        })
        .join("\n\n");
    }

    async function copyText(text) {
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        showCopied();
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        showCopied();
      }
    }

    function copyLatest() {
      copyText(getLatestText());
    }

    function copyAll() {
      copyText(getAllText());
    }

    function clearPoints() {
      points = [];
      renderPoints();
    }

    function showCopied() {
      copyNote.classList.add("show");

      setTimeout(() => {
        copyNote.classList.remove("show");
      }, 1200);
    }

    mapBox.addEventListener("mousemove", handleMapMove);
    mapBox.addEventListener("click", handleMapClick);
  </script>
</body>
</html>
