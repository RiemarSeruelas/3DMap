upstream streetview_api {
  server streetview-api:3010;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 60m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://streetview_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_request_buffering off;
  }

  location = /health {
    proxy_pass http://streetview_api/health;
    proxy_set_header Host $host;
  }

  location = /streetview-data.json {
    proxy_pass http://streetview_api/streetview-data.json;
    add_header Cache-Control "no-store" always;
  }

  location /data/ {
    proxy_pass http://streetview_api;
    add_header Cache-Control "no-store" always;
  }

  location /uploads/ {
    alias /srv/streetview/uploads/;
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
